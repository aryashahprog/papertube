name: Weekly digest
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without sending
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: weekly-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate digest
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run digest -- --dry-run
          else
            npm run digest
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: digest-preview
          path: digest-preview/
